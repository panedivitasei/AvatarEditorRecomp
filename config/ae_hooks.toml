# Save-and-Exit null-op guard: the save flow's UI states 76/77 poll a
# GamerPicManager op object; if its creation fails the slot stays null and the
# pollers deref op+12. With r3 == 0 skip the body; r3 already holds the correct
# idle return. XamAvatarSetManifest persists the save data before these states
# run, so a null op only skips the gamerpic upload.

# sub_92201DF8: op-state getter `return *(op+12)`.
[[midasm_hook]]
address = 0x92201DF8
name = "AE_GuardNullOpState"
registers = ["r3"]
return_on_true = true

# sub_920C7680: op "is active (states 1..4)" check, same NULL deref.
[[midasm_hook]]
address = 0x920C7680
name = "AE_GuardNullOpActive"
registers = ["r3"]
return_on_true = true

# In-game XUI search bar (Ctrl+F): sniff the core handle-resolved XUI
# message dispatch 0x9215E1B0(handle, XuiMessage*). XuiMessage: +4 = msg
# id, +16 -> params, params+12 = wchar* text for set-text messages. While
# the search is open the heading set-text carries the status line; see
# xui_hooks.cpp.
[[midasm_hook]]
address = 0x9215E1B0
name = "AE_SniffXuiSetText"
registers = ["r3", "r4"]

# D3DDevice_Swap entry (0x9211DA80): once-per-frame point for the Ctrl+F search tick, observe-only.
[[midasm_hook]]
address = 0x9211DA80
name = "AE_XuiFrameTick"

[[midasm_hook]]
address = 0x921FF0A0        # sub_921FF0A0 entry, r3 = XUI tile task
name = "AE_TileSizeHint"
registers = ["r3"]

[[midasm_hook]]
address = 0x921FF0C4        # sub_921FF0A0: after li r11,16384 (tile buffer size, stored at +80)
name = "AE_TileBufferSize"
registers = ["r11"]

# Kinect identity hint ("Identifying. Please face the sensor."): end of the
# widget ctor sub_921FA7C0, r31 = widget with the IdentifyingGrp handle at
# +12; the hook hides that element (there is no Kinect).
[[midasm_hook]]
address = 0x921FA820        # sub_921FA7C0: addi r1 after the 2nd bl sub_92168390
name = "AE_HideIdentifyingGrp"
registers = ["r31"]
return_on_true = true

# Marketplace manifest parser probes (observe-only, ae_mkt_trace). The channel
# manifest goes through a SAX state machine (sub_922077B8, r3 = parser ctx);
# these print the event stream and what its two validators see.
[[midasm_hook]]
address = 0x922077B8        # sub_922077B8 entry: one call per SAX event
name = "AE_MktParserEvent"
registers = ["r3"]

[[midasm_hook]]
address = 0x92207680        # sub_92207680 entry: per-slot validator
name = "AE_MktSlotValidate"
registers = ["r3"]

[[midasm_hook]]
address = 0x922075B8        # sub_922075B8 entry: channel validator at </manifest>
name = "AE_MktChannelValidate"
registers = ["r3"]

# Net driver probes (observe-only). r3 = driver object; the XHTTP pump struct
# sits at +840 and the abort flags at +288.
[[midasm_hook]]
address = 0x9220B2D8        # sub_9220B2D8 entry: poll step, r4 = target pump state
name = "AE_MktNetPoll"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x9220B038        # sub_9220B038 entry: headers stage, r4 = hr
name = "AE_MktNetHeaders"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x9220AE28        # sub_9220AE28 entry: driver teardown
name = "AE_MktNetTeardown"
registers = ["r3"]

[[midasm_hook]]
address = 0x9228E3F0        # sub_9228E3F0 entry: request/connection close
name = "AE_MktNetClose"
registers = ["r3"]

# Store navigation probes (observe-only). Selecting a tile resolves its action
# string against the category registry and then lazily builds a preview object;
# the fault lands in that window.
[[midasm_hook]]
address = 0x920D2EF0        # sub_920D2EF0(registry, name, flags): scene/slot lookup
name = "AE_MktSceneLookup"
registers = ["r3", "r4", "r5"]

[[midasm_hook]]
address = 0x920E0620        # sub_920E0620(obj): lazy preview load on selection
name = "AE_MktPreviewLoad"
registers = ["r3"]

[[midasm_hook]]
address = 0x920E04B0        # sub_920E04B0(obj, record): applies the found record
name = "AE_MktPreviewApply"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x920D4970        # sub_920D4970(fetcher, name, ...): item metadata fetch
name = "AE_MktItemFetch"
registers = ["r3", "r4"]

# The store page loader's three error sites and the category fetcher the
# pages share, enough to say why a store page gave up.
[[midasm_hook]]
address = 0x920E21AC        # sub_920E2080: error 11, LIVE session check timed out
name = "AE_MktPageError"
registers = ["r11", "r30"]

[[midasm_hook]]
address = 0x920E2340        # sub_920E2080: error 17, store list with no categories
name = "AE_MktPageError"
registers = ["r11", "r30"]

[[midasm_hook]]
address = 0x920E2400        # sub_920E2080: error 17, page with no items after a second
name = "AE_MktPageError"
registers = ["r11", "r30"]

[[midasm_hook]]
address = 0x920D4760        # sub_920D4760(fetcher, name, page, size, ...): category fetch step
name = "AE_MktCatFetch"
registers = ["r3", "r4", "r5", "r6"]

[[midasm_hook]]
address = 0x920D4C70        # sub_920D4C70(fetcher, request): issues the query
name = "AE_MktQueryIssue"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x920D4548        # sub_920D4548(_, kind): scene kind -> query descriptor
name = "AE_MktDispatchKind"
registers = ["r4"]

[[midasm_hook]]
address = 0x92203D60        # sub_92203D60(client, req): builds the title:<id> query
name = "AE_MktTitleQuery"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x922031E0        # sub_922031E0(handle, ...): marshals the query call
name = "AE_MktMarshal"
registers = ["r3", "r5"]

# Try-on pipeline probes (observe-only): does hovering a store item ask for a
# preview at all, and what error does the pipeline record if it refuses.
[[midasm_hook]]
address = 0x920DFDF0        # sub_920DFDF0: gated preview/try-on start
name = "AE_MktWearStart"
registers = ["r3"]

[[midasm_hook]]
address = 0x920E0680        # sub_920E0680: preview pipeline continuation
name = "AE_MktWearStep"
registers = ["r3"]

# The FindGameOffers URL formatter passes nine arguments to _snwprintf; the
# ninth (the RatingIds tail, its sixth vararg) travels in the first stack
# slot, where the title stores the word at slot+0 and the host CRT shim reads
# the slot's low half. Mirror the word across the slot before the call so the
# shim picks up the real pointer instead of stale stack garbage.
[[midasm_hook]]
address = 0x922044DC        # sub_922042D8: bl _snwprintf, the 9-arg query build
name = "AE_MktRatingArgFix"
registers = ["r1"]

# Purchase history. The store marks a tile "purchased" when its id is in the
# history the title fetches from an XBOS service behind the LIVE secure
# gateway, which never answers here, so the fetch stays pending for good.
# Locally the closet is the purchase history: the manager reports itself
# complete and the lookup is answered from the closet. The fetch itself is
# left alone; skipping it moved the heap around enough to leave store tiles
# on their spinner.
[[midasm_hook]]
address = 0x92201DF8        # sub_92201DF8 entry: manager status getter, r3 = manager
name = "AE_MktOwnStatus"
registers = ["r3"]
return_on_true = true

[[midasm_hook]]
address = 0x92202A80        # sub_92202A80 entry: CResourceManager contains(r3 = manager, r4 = 16-byte id)
name = "AE_MktOwnContains"
registers = ["r3", "r4"]
return_on_true = true

# Hover try-on. Each store tile only wears its item once sub_920DB528 stops
# calling it busy, and that needs the generation word at unk_9452E398 (copied
# into tile+952 by the tick) to be non-zero. Nothing in the binary writes it,
# so seed it once when the first tile ticks.
[[midasm_hook]]
address = 0x920DBCD0        # sub_920DBCD0 entry: store tile tick, r3 = tile
name = "AE_MktHoverTryOn"
registers = ["r3"]

# Purchase gate. sub_920DB6F8 reads the parental-control XConfig byte and
# treats a missing setting as "restricted", which routes every store
# purchase through XamShowPasscodeVerifyUI, a system overlay that does not
# exist here. Report unrestricted so the purchase reaches XamShowMarketplaceUI.
[[midasm_hook]]
address = 0x920DB6F8        # sub_920DB6F8 entry: parental restriction query
name = "AE_MktNoParentalGate"
registers = ["r3"]
return_on_true = true

[[midasm_hook]]
address = 0x920DB768        # sub_920DB768 entry: marketplace UI launch for a tile, r3 = tile
name = "AE_MktPurchase"
registers = ["r3"]

# D3D::SetRawGammaRamp (0x9212A0F8): the XDK uploads the display-corrected
# gamma ramp to the DC_LUT from here, straight off the stack at device setup,
# so the device block never holds the table the hardware applies. r4 = ramp.
[[midasm_hook]]
address = 0x9212A0F8
name = "AE_HookRawGammaRamp"
registers = ["r4"]

# ============================================================================
# GPU edge layer (src/gpu/edge.cpp): the D3D runtime's GPU-facing side with no GPU behind it.
# ============================================================================

# CDevice::SetFence, at the store of the advanced fence counter: complete the fence and its ring position.
[[midasm_hook]]
address = 0x92125EC4
name = "AeEdge_FenceIssued"
registers = ["r5", "r6", "r11"]

# CDevice::AddCallsToPrimaryBuffer, at the store of the new primary write index: the ring reads as consumed.
[[midasm_hook]]
address = 0x92125B70
name = "AeEdge_PrimaryKick"
registers = ["r11", "r24"]

# CDevice::QueueIndirectBuffer, after each add to the outstanding-buffer count: the GPU would retire them, so the
# count returns to zero at once.
[[midasm_hook]]
address = 0x92125FB0
name = "AeEdge_ChunkQueued"
registers = ["r31"]

[[midasm_hook]]
address = 0x92126030
name = "AeEdge_ChunkQueued"
registers = ["r31"]

[[midasm_hook]]
address = 0x9212605C
name = "AeEdge_ChunkQueued"
registers = ["r31"]
